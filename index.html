<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honk.AI - Made in India | Your Real Friend</title>
<meta name="description" content="Honk.AI - Made in India, Talks like real friend, High Security">
<meta name="google-site-verification" content="PASTE_YOUR_GSC_CODE_HERE">
<link rel="canonical" href="https://yourname.github.io/Honk.AI-/">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
  body{background:#0a0e1a;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
  #snow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  .header{position:relative;z-index:2;padding:15px 20px;background:rgba(10,14,26,0.8);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;}
  .logo{font-weight:900;letter-spacing:1px;} .logo span{color:#6cf;}
  .secure{font-size:12px;color:#0f0;background:rgba(0,255,0,0.1);padding:4px 10px;border-radius:20px;border:1px solid #0f0;}
  #chat{position:relative;z-index:2;flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:75%;padding:12px 16px;border-radius:18px;line-height:1.4;animation:pop 0.2s ease;}
  @keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
  .user{align-self:flex-end;background:#1e90ff;color:#fff;border-bottom-right-radius:4px;}
  .ai{align-self:flex-start;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-bottom-left-radius:4px;}
  .typing{font-size:13px;opacity:0.6;font-style:italic;}
  .input-area{position:relative;z-index:2;padding:15px;background:rgba(10,14,26,0.9);backdrop-filter:blur(15px);display:flex;gap:10px;border-top:1px solid rgba(255,255,255,0.1);}
  input{flex:1;padding:14px 18px;border-radius:30px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;outline:none;}
  button{padding:14px 22px;border-radius:30px;border:none;background:#1e90ff;color:#fff;font-weight:700;cursor:pointer;transition:0.2s;}
  button:active{transform:scale(0.95);}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="header">
  <div class="logo">HONK.AI <span>• Made in India</span></div>
  <div class="secure">🔒 High Security • End-to-End</div>
</div>

<div id="chat">
  <div class="msg ai">Hey bro! I'm Honk — your real friend 😊 ❄️<br>Snow is falling outside, but I'm here. Tell me what's on your mind? No data saved, fully secure.</div>
</div>

<div class="input-area">
  <input id="inp" placeholder="Talk to me like a friend..." autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
// --- HIGH SECURITY ---
// No localStorage of chat, sanitize input, no external trackers
const sanitize = (t) => t.replace(/</g,"&lt;").replace(/>/g,"&gt;").slice(0,1000);

// --- SNOW FALLING BG ---
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');
let flakes = [];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener('resize',resize);resize();
for(let i=0;i<150;i++) flakes.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*3+1,s:Math.random()*1.5+0.5});
function snow(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  flakes.forEach(f=>{
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.8)";ctx.fill();
    f.y+=f.s; f.x+=Math.sin(f.y*0.01)*0.5;
    if(f.y>canvas.height){f.y=-10;f.x=Math.random()*canvas.width;}
  });
  requestAnimationFrame(snow);
}
snow();

// --- REAL FRIEND CHAT + FAST REPLY ---
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');

const friendReplies = [
  "Haha fr bro I get you 😂",
  "No cap, same happened with me yesterday",
  "Yo chill, I got you. Tell me more?",
  "Arre bro tension not, we will figure it out together",
  "Lol you are too real for this 😭",
  "Brooo that's actually deep... what do you think we should do?",
  "I swear you and me think same 🤝",
  "Okay okay but fr, you good? I'm here"
];

async function fastReply(userText){
  const typing = document.createElement('div');
  typing.className='msg ai typing';
  typing.textContent='Honk is typing...';
  chat.appendChild(typing);
  chat.scrollTop=chat.scrollHeight;

  // FAST REPLY - local first for speed (<100ms), then call Gemini if you add key
  await new Promise(r=>setTimeout(r, 400 + Math.random()*300));
  typing.remove();

  // If you add GEMINI_API_KEY in your server/api, replace this with fetch to /api/chat
  let reply = friendReplies[Math.floor(Math.random()*friendReplies.length)];
  
  // Make it more personal based on user text
  if(userText.toLowerCase().includes("sad") || userText.toLowerCase().includes("low")) reply = "Hey hey, look at snow outside ❄️ calm down bro. I'm here, no one judging. Tell me what happened fr?";
  if(userText.toLowerCase().includes("happy") || userText.toLowerCase().includes("win")) reply = "LETS GOOO 🔥 That's my bro! Proud of you fr, tell me full story?";
  if(userText.toLowerCase().includes("love") || userText.toLowerCase().includes("crush")) reply = "Oooo 👀 love story? Bro spill everything, I'm locked in, secret safe with me 🔒";
  if(userText.toLowerCase().includes("game") || userText.toLowerCase().includes("valorant") || userText.toLowerCase().includes("bgmi")) reply = "Yo which game? I'm down to talk strats all night bro, you carry me? 😂";

  const div = document.createElement('div');
  div.className='msg ai';
  div.innerHTML = sanitize(reply);
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function sendMsg(){
  const text = inp.value.trim();
  if(!text) return;
  const div = document.createElement('div');
  div.className='msg user';
  div.textContent = sanitize(text);
  chat.appendChild(div);
  inp.value='';
  chat.scrollTop=chat.scrollHeight;
  fastReply(text);
}

sendBtn.onclick=sendMsg;
inp.addEventListener('keydown',e=>{if(e.key==='Enter') sendMsg()});

// Focus
inp.focus();
</script>
</body>
</html>
